name: Build Data Guard APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Build APK
        run: |
          GRADLEW=$(find extracted -name gradlew -type f -print -quit)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found in ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
          APK=$(find . -path '*/build/outputs/apk/debug/*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/DataGuard.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DataGuard-APK
          path: DataGuard.apk
