name: Build Data Guard APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: |
          unzip -q DataGuard-Project-Source.zip -d extracted
          find extracted -name settings.gradle.kts

      - name: Build APK
        run: |
          cd extracted
          PROJECT=$(find . -name settings.gradle.kts -printf '%h\n' | head -1)
          cd "$PROJECT"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DataGuard-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
